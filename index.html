<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ArduLab</title>

<style>
:root{
  --arduino:#00979d;
  --orange:#ff7a00;
  --bg:#f6f8fb;
  --card:#ffffff;
  --line:#dfe5ec;
  --text:#202630;
  --muted:#6d7684;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Noto Sans KR",sans-serif;
}

.container{
  width:min(1200px,calc(100% - 32px));
  margin:24px auto;
}

.header{
  text-align:center;
  margin-bottom:20px;
}

.title{
  font-size:44px;
  font-weight:900;
  margin:0;
}

.title .ardu{
  color:var(--arduino);
}

.title .lab{
  color:var(--orange);
}

.author{
  margin-top:5px;
  color:#999;
  font-size:13px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 5px 18px rgba(30,45,70,.05);
}

.card h2{
  margin:0 0 14px;
  font-size:18px;
}

.connection-grid{
  display:grid;
  grid-template-columns:180px 180px 1fr;
  gap:10px;
  align-items:end;
}

label{
  display:block;
  font-weight:700;
  margin-bottom:6px;
}

select,
button{
  font:inherit;
}

select{
  width:100%;
  padding:11px;
  border:1px solid var(--line);
  border-radius:10px;
  background:white;
}

.buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 16px;
  font-weight:800;
  cursor:pointer;
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.primary{
  background:var(--arduino);
  color:white;
}

.orange{
  background:var(--orange);
  color:white;
}

.soft{
  background:#eaf4f5;
  color:#08767b;
}

.gray{
  background:#edf0f4;
  color:#39414d;
}

.status-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.status-box{
  padding:14px;
  border-radius:12px;
  background:#f8fafc;
  border:1px solid var(--line);
}

.status-box b{
  display:block;
  margin-bottom:5px;
}

.status-value{
  color:var(--arduino);
  font-weight:800;
}

.variables{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.variable-chip{
  padding:7px 12px;
  border-radius:999px;
  background:#eaf7f7;
  color:#08767b;
  font-weight:800;
}

.notice{
  color:var(--muted);
  line-height:1.6;
}

.table-wrap{
  width:100%;
  overflow:auto;
  max-height:430px;
  border:1px solid var(--line);
  border-radius:12px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
}

th,
td{
  padding:9px 12px;
  border-bottom:1px solid #edf0f4;
  text-align:center;
  white-space:nowrap;
}

th{
  position:sticky;
  top:0;
  z-index:2;
  background:#eef7f7;
  color:#16686c;
}

.empty{
  text-align:center;
  padding:35px;
  color:#8a929d;
}

.footer{
  text-align:center;
  color:#aaa;
  font-size:12px;
  padding:10px 0 25px;
}

@media(max-width:750px){
  .connection-grid{
    grid-template-columns:1fr;
  }

  .status-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <header class="header">
    <h1 class="title">
      <span class="ardu">Ardu</span><span class="lab">Lab</span>
    </h1>
    <div class="author">Made by. PhyPark & GPT</div>
  </header>


  <section class="card">

    <h2>🔌 Arduino 연결</h2>

    <div class="connection-grid">

      <div>
        <label>보드레이트</label>

        <select id="baudRate">
          <option value="9600">9600</option>
          <option value="19200">19200</option>
          <option value="38400">38400</option>
          <option value="57600">57600</option>
          <option value="115200">115200</option>
        </select>
      </div>


      <div class="buttons">
        <button
          id="connectBtn"
          class="primary">
          Arduino 연결
        </button>

        <button
          id="disconnectBtn"
          class="gray"
          disabled>
          연결 해제
        </button>
      </div>

      <div class="notice">
        Arduino 출력 형식:
        <b>freq:500,sound:372</b>
      </div>

    </div>

  </section>



  <section class="card">

    <h2>📡 연결 상태</h2>

    <div class="status-grid">

      <div class="status-box">
        <b>상태</b>
        <span
          id="connectionStatus"
          class="status-value">
          연결 안 됨
        </span>
      </div>

      <div class="status-box">
        <b>수집 데이터</b>
        <span
          id="dataCount"
          class="status-value">
          0개
        </span>
      </div>

      <div class="status-box">
        <b>실제 샘플링</b>
        <span
          id="samplingInfo"
          class="status-value">
          -
        </span>
      </div>

    </div>

  </section>



  <section class="card">

    <h2>🔎 수신 중인 변수</h2>

    <div id="variableStatus" class="notice">
      Arduino 연결 후 변수를 인식합니다.
    </div>

    <div
      id="variables"
      class="variables"
      style="margin-top:12px;">
    </div>

  </section>



  <section class="card">

    <h2>🧪 데이터 수집</h2>

    <div class="buttons">

      <button
        id="collectBtn"
        class="orange"
        disabled>
        ▶ 데이터 수집 시작
      </button>

      <button
        id="resetBtn"
        class="gray">
        처음으로
      </button>

    </div>

    <p class="notice">
      연결 후 변수 구성이 안정적으로 확인되면
      데이터 수집 버튼이 활성화됩니다.
    </p>

  </section>



  <section class="card">

    <h2>📋 실험 데이터</h2>

    <div class="table-wrap">

      <table id="dataTable">

        <thead id="tableHead">
        </thead>

        <tbody id="tableBody">
        </tbody>

      </table>

      <div
        id="emptyTable"
        class="empty">
        아직 수집된 데이터가 없습니다.
      </div>

    </div>

  </section>


  <div class="footer">
    ArduLab Web
  </div>

</div>



<script>

// ============================================================
// ArduLab Web
// 기본 설정
// ============================================================

const SCHEMA_CONFIRM_COUNT = 3;
const MAX_DATA_COUNT = 6000;


// ============================================================
// 상태 변수
// ============================================================

let port = null;
let reader = null;
let keepReading = false;

let collecting = false;

let lineBuffer = "";

let variables = [];

let lastSchema = null;
let sameSchemaCount = 0;

let validDataReceived = false;

let dataRows = [];

let startTime = null;


// 실제 샘플링 계산용
let lastSampleTime = null;
let totalSampleInterval = 0;
let sampleIntervalCount = 0;


// ============================================================
// 화면 요소
// ============================================================

const baudRate =
  document.getElementById("baudRate");

const connectBtn =
  document.getElementById("connectBtn");

const disconnectBtn =
  document.getElementById("disconnectBtn");

const collectBtn =
  document.getElementById("collectBtn");

const resetBtn =
  document.getElementById("resetBtn");

const connectionStatus =
  document.getElementById("connectionStatus");

const dataCount =
  document.getElementById("dataCount");

const samplingInfo =
  document.getElementById("samplingInfo");

const variableStatus =
  document.getElementById("variableStatus");

const variablesDiv =
  document.getElementById("variables");

const tableHead =
  document.getElementById("tableHead");

const tableBody =
  document.getElementById("tableBody");

const emptyTable =
  document.getElementById("emptyTable");



// ============================================================
// Arduino 데이터 파싱
// ============================================================

function parseLine(line){

  line = line.trim();

  if(!line){
    return null;
  }


  const parts =
    line.split(",");

  const result = {};


  for(const partText of parts){

    const part =
      partText.trim();

    const separator =
      part.indexOf(":");


    if(separator === -1){
      return null;
    }


    const key =
      part
        .slice(0,separator)
        .trim();


    const valueText =
      part
        .slice(separator + 1)
        .trim();


    // 변수명 검사
    if(
      !/^[A-Za-z_][A-Za-z0-9_]*$/.test(key)
    ){
      return null;
    }


    const value =
      Number(valueText);


    if(!Number.isFinite(value)){
      return null;
    }


    // 같은 변수명이 한 줄에 두 번 나오면 무효
    if(
      Object.prototype.hasOwnProperty.call(
        result,
        key
      )
    ){
      return null;
    }


    result[key] = value;
  }


  return Object.keys(result).length
    ? result
    : null;
}



// ============================================================
// 변수 인식
// ============================================================

function processValidData(data){

  validDataReceived = true;


  const schema =
    Object.keys(data);


  const schemaText =
    schema.join("|");


  if(schemaText === lastSchema){

    if(
      sameSchemaCount <
      SCHEMA_CONFIRM_COUNT
    ){
      sameSchemaCount++;
    }

  }else{

    lastSchema =
      schemaText;

    sameSchemaCount = 1;
  }


  if(
    sameSchemaCount <
    SCHEMA_CONFIRM_COUNT
  ){

    variableStatus.textContent =
      "감지된 변수 구성: " +
      schema.join(", ") +
      " (" +
      sameSchemaCount +
      "/" +
      SCHEMA_CONFIRM_COUNT +
      ")";

    return;
  }


  if(
    variables.join("|") !==
    schemaText
  ){

    variables =
      schema.slice();

    showVariables();

    rebuildTable();

    collectBtn.disabled = false;
  }


  variableStatus.textContent =
    "변수 인식 완료";


  if(collecting){

    addData(data);
  }
}



// ============================================================
// 변수 표시
// ============================================================

function showVariables(){

  variablesDiv.innerHTML = "";


  const names =
    ["time", ...variables];


  for(const name of names){

    const chip =
      document.createElement("span");

    chip.className =
      "variable-chip";

    chip.textContent =
      name;

    variablesDiv.appendChild(chip);
  }
}



// ============================================================
// 데이터 저장
// ============================================================

function addData(data){

  if(startTime === null){

    startTime =
      performance.now();

    lastSampleTime =
      startTime;
  }


  const now =
    performance.now();


  const elapsed =
    (now - startTime) /
    1000;


  const row = {
    time:
      Number(
        elapsed.toFixed(3)
      ),
    ...data
  };


  dataRows.push(row);


  // 최대 6000개
  if(
    dataRows.length >
    MAX_DATA_COUNT
  ){

    dataRows.shift();

    rebuildAllRows();
  }else{

    appendTableRow(
      row,
      dataRows.length
    );
  }


  updateSampling(now);


  dataCount.textContent =
    dataRows.length +
    "개";
}



// ============================================================
// 실제 샘플링 계산
// ============================================================

function updateSampling(now){

  if(lastSampleTime !== null){

    const interval =
      (now - lastSampleTime) /
      1000;


    if(interval > 0){

      totalSampleInterval +=
        interval;

      sampleIntervalCount++;


      const average =
        totalSampleInterval /
        sampleIntervalCount;


      const hz =
        1 / average;


      samplingInfo.textContent =
        average.toFixed(3) +
        " s / " +
        hz.toFixed(1) +
        " Hz";
    }
  }


  lastSampleTime = now;
}



// ============================================================
// 표 생성
// ============================================================

function rebuildTable(){

  tableHead.innerHTML = "";
  tableBody.innerHTML = "";


  const headerRow =
    document.createElement("tr");


  const headers =
    [
      "No.",
      "time",
      ...variables
    ];


  headers.forEach(name=>{

    const th =
      document.createElement("th");

    th.textContent =
      name;

    headerRow.appendChild(th);
  });


  tableHead.appendChild(
    headerRow
  );


  rebuildAllRows();
}



function rebuildAllRows(){

  tableBody.innerHTML = "";


  dataRows.forEach(
    (row,index)=>{

      appendTableRow(
        row,
        index + 1
      );
    }
  );
}



function appendTableRow(
  row,
  number
){

  emptyTable.style.display =
    "none";


  const tr =
    document.createElement("tr");


  const values =
    [
      number,
      row.time,
      ...variables.map(
        name=>
          row[name] ?? ""
      )
    ];


  values.forEach(value=>{

    const td =
      document.createElement("td");

    td.textContent =
      value;

    tr.appendChild(td);
  });


  tableBody.appendChild(tr);


  // 항상 마지막 데이터 보이게
  tr.scrollIntoView({
    block:"nearest"
  });
}



// ============================================================
// Serial 읽기
// ============================================================

async function readSerial(){

  const decoder =
    new TextDecoderStream();


  const readableClosed =
    port.readable.pipeTo(
      decoder.writable
    );


  reader =
    decoder.readable.getReader();


  try{

    while(keepReading){

      const {
        value,
        done
      } =
        await reader.read();


      if(done){
        break;
      }


      if(!value){
        continue;
      }


      lineBuffer += value;


      const lines =
        lineBuffer.split(
          /\r?\n/
        );


      lineBuffer =
        lines.pop();


      for(const line of lines){

        const data =
          parseLine(line);


        if(data){
          processValidData(data);
        }
      }
    }

  }catch(error){

    console.error(error);

    connectionStatus.textContent =
      "연결 오류";

  }finally{

    if(reader){

      try{
        reader.releaseLock();
      }catch(e){}

      reader = null;
    }
  }


  try{
    await readableClosed;
  }catch(e){}
}



// ============================================================
// Arduino 연결
// ============================================================

connectBtn.addEventListener(
  "click",
  async()=>{

    if(
      !("serial" in navigator)
    ){

      alert(
        "현재 브라우저는 Web Serial을 지원하지 않습니다.\nChrome 또는 Edge를 사용해주세요."
      );

      return;
    }


    try{

      port =
        await navigator.serial.requestPort();


      await port.open({

        baudRate:
          Number(
            baudRate.value
          )

      });


      keepReading = true;


      connectionStatus.textContent =
        "연결됨";


      connectBtn.disabled =
        true;

      disconnectBtn.disabled =
        false;

      baudRate.disabled =
        true;


      readSerial();


    }catch(error){

      console.error(error);

      connectionStatus.textContent =
        "연결 실패";
    }
  }
);



// ============================================================
// Arduino 연결 해제
// ============================================================

disconnectBtn.addEventListener(
  "click",
  async()=>{

    keepReading = false;

    collecting = false;


    try{

      if(reader){
        await reader.cancel();
      }

    }catch(e){}


    try{

      if(port){
        await port.close();
      }

    }catch(e){}


    port = null;


    connectionStatus.textContent =
      "연결 해제";


    connectBtn.disabled =
      false;

    disconnectBtn.disabled =
      true;

    baudRate.disabled =
      false;


    collectBtn.textContent =
      "▶ 데이터 수집 시작";
  }
);



// ============================================================
// 데이터 수집 시작 / 중지
// ============================================================

collectBtn.addEventListener(
  "click",
  ()=>{

    if(!collecting){

      if(
        dataRows.length === 0
      ){

        startTime = null;

        lastSampleTime = null;

        totalSampleInterval = 0;

        sampleIntervalCount = 0;
      }


      collecting = true;


      collectBtn.textContent =
        "⏹ 데이터 수집 중지";


      connectionStatus.textContent =
        "데이터 수집 중";


    }else{

      collecting = false;


      collectBtn.textContent =
        "▶ 계속 실험하기";


      connectionStatus.textContent =
        "데이터 수집 중지";
    }
  }
);



// ============================================================
// 처음으로
// Arduino 연결은 유지합니다.
// 실험 데이터만 초기화합니다.
// ============================================================

resetBtn.addEventListener(
  "click",
  ()=>{

    collecting = false;

    dataRows = [];

    startTime = null;

    lastSampleTime = null;

    totalSampleInterval = 0;

    sampleIntervalCount = 0;


    tableBody.innerHTML =
      "";


    emptyTable.style.display =
      "block";


    dataCount.textContent =
      "0개";


    samplingInfo.textContent =
      "-";


    collectBtn.textContent =
      "▶ 데이터 수집 시작";


    if(
      variables.length
    ){

      collectBtn.disabled =
        false;

    }else{

      collectBtn.disabled =
        true;
    }


    connectionStatus.textContent =
      port
        ? "연결됨"
        : "연결 안 됨";
  }
);

</script>

</body>
</html>
